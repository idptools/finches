name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
        # requires-python is >=3.9 (pyproject.toml)
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    # the conda environment is only active in a login shell
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        run: |
          uname -a
          df -h
          ulimit -a

      # More info on options: https://github.com/mamba-org/setup-micromamba
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}
          init-shell: bash
          cache-environment: true

      - name: Install package
        # installs any runtime dependency not already provided by the conda
        # environment, then builds the Cython extension (matrix_manipulation) in
        # place. The tests run against the source tree because their reference
        # data (finches/tests/test_data/*.npz) and example structures
        # (examples/) are not part of the installed package.
        run: |
          python -m pip install .
          python setup.py build_ext --inplace
          micromamba list

      - name: Run tests
        run: |
          pytest -v --cov=finches --cov-report=xml --color=yes finches/tests/

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
