[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "versioningit~=2.0",
    "cython",
    "numpy",
]
build-backend = "setuptools.build_meta"

# Self-descriptive entries which should always be present
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "finches"
description = "Package for predicting chemical specificity in disordered regions"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Garrett M. Ginell", email = "g.ginell@wustl.edu" },
    { name = "Alex S. Holehouse", email = "alex.holehouse@wustl.edu" },
]
license = { text = "CC BY-NC 4.0" }

# See https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
# Declare any run-time dependencies that should be installed with the package.
dependencies = [
    "numpy",
    "scipy",
    "metapredict",
    "ipython",
    "matplotlib",
    "tqdm",
    "mdtraj",
    "networkx",
]

[project.urls]
"Source" = "https://github.com/idptools/finches"
"Documentation" = "https://finches.readthedocs.io"
"Webserver" = "https://www.finches-online.com"

[project.optional-dependencies]
test = [
    "pytest>=6.1.2",
    "pytest-cov",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
where = ["."]
include = ["finches", "finches.*"]  # Discover all sub-packages inside the main package


# Ref https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
finches = [
    "py.typed"
]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "finches/_version.py"

[tool.ruff]
# the line length ruff format already produces (its default), made explicit;
# the target version follows requires-python. Notebooks are exploratory and
# carry executed outputs, so they are neither linted nor reformatted.
line-length = 88
extend-exclude = ["*.ipynb"]
